# === Split link connection parameters (central dictates these) ===
#
# The central opens each peripheral link with these values at connect time and
# ZMK never renegotiates them afterwards, so whatever is set here is what the
# split link runs with for its entire life.
#
# Upstream defaults are INT=6 (7.5ms), LATENCY=30, TIMEOUT=400 (4s). A slave
# latency of 30 lets a peripheral skip up to 30 connection events, so the
# worst-case peripheral -> central delivery time is
#     interval * (latency + 1) = 7.5ms * 31 = 232.5ms
# Dropping latency to 0 makes the peripheral listen every connection event,
# which bounds that worst case at one interval (7.5ms).
#
# The battery cost is real (the radio wakes ~133x/s instead of ~4x/s when
# idle) but small next to the RGB underglow and backlight this board already
# runs. If battery life matters more than the tail latency, LATENCY=3 is a
# reasonable middle ground (worst case 30ms).
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# Optional, NOT enabled: sub-7.5ms connection intervals via the Zephyr
# controller (ZMK issue #3381). These are not Bluetooth-spec-compliant and
# only work between two Zephyr devices. That constraint is satisfied here
# (dongle <-> halves are all Zephyr, and the dongle reaches the host over
# USB), but they are unnecessary to fix a 232ms problem and would affect the
# dongle's BLE output profiles if those are ever used. Left here as a
# documented next step rather than a default.
#CONFIG_BT_CTLR_ADVANCED_FEATURES=y
#CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
#CONFIG_BT_CONN_PARAM_ANY=y
